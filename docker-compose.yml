services:
  nocturnedesk:
    build: .
    image: nocturnedesk:latest
    container_name: nocturnedesk
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-200}
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      - ./data:/app/data
