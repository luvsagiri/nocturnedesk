name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            binary_name: nocturnedesk.exe
            asset_name: nocturnedesk-windows-amd64.zip
          - goos: linux
            goarch: amd64
            binary_name: nocturnedesk
            asset_name: nocturnedesk-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            binary_name: nocturnedesk
            asset_name: nocturnedesk-linux-arm64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          go build -trimpath -ldflags="-s -w" -o build/${{ matrix.binary_name }} .

      - name: Package Archive (Windows Zip)
        if: matrix.goos == 'windows'
        run: |
          cd build
          cp ../README.md ../LICENSE ../.env.example ./
          zip -r ../${{ matrix.asset_name }} ./*
          cd ..

      - name: Package Archive (Linux Tar.gz)
        if: matrix.goos == 'linux'
        run: |
          cd build
          cp ../README.md ../LICENSE ../.env.example ./
          tar -czvf ../${{ matrix.asset_name }} ./*
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Upload to GitHub Release (on Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload to Latest Release (on Main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NocturneDesk Latest Build
          files: ${{ matrix.asset_name }}
          prerelease: true
