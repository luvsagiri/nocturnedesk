{{define "content"}}
<div class="hero min-h-[50vh] flex items-center justify-center">
  <div class="hero-content text-center">
    <div class="max-w-md">
      <h1 class="text-6xl font-black text-primary mb-2">{{.Code}}</h1>
      <p class="text-xl font-semibold mb-4">{{.Message}}</p>
      <p class="text-sm text-base-content/60 mb-6">{{.Detail}}</p>
      <a href="/" class="btn btn-primary btn-sm">返回首页</a>
    </div>
  </div>
</div>
{{end}}
